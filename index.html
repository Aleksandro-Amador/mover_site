<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name='robots' content='index, follow, max-image-preview:large' />

    <!-- 🏆 Título da Aba do Navegador -->
    <title>MOVER | Movimento Organizacional Vencer, Educar e Realizar</title>

    <!-- 🌍 Configurações de SEO e Compartilhamento (WhatsApp / Open Graph) -->
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    
    <!-- Título: Aparecerá em negrito no WhatsApp -->
    <meta property="og:title" content="MOVER - Movimento Organizacional Vencer, Educar e Realizar" />
    
    <!-- Descrição: Texto que aparece abaixo do título no compartilhamento -->
    <meta property="og:description" content="Juntos podemos tornar sonhos em realidade, movendo e transformando vidas nós construímos o futuro." />
    
    <meta property="og:url" content="https://mover.org.br/" />
    <meta property="og:site_name" content="MOVER" />

    <!-- 🚀 Imagem de Compartilhamento: Caminho fixo da pasta public -->
    <meta property="og:image" content="https://mover.org.br/logo_mover_novo.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/webp" />

    <!-- Twitter Card (Opcional, mas bom para SEO) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MOVER - Movimento Organizacional" />
    <meta name="twitter:description" content="Transformando vidas e construindo o futuro." />
    <meta name="twitter:image" content="https://mover.org.br/logo_mover_novo.webp" />

    <!-- 🎨 Favicon (Ícone da aba) -->
    <link rel="icon" type="image/svg+xml" href="/logo_2_site_mover_catavento.webp" />

</head>
<body>
    <!-- 🏗️ Ponto de entrada do React -->
    <div id="root"></div>

    <!-- ⚙️ Script Principal: O Vite gerencia este caminho no build -->
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
